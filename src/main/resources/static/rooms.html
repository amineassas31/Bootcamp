<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des Salles - Administration</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="header"></header>
<main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;">Gestion des Salles</h2>
        <button onclick="openRoomModal()" class="big-btn" style="width: auto; margin: 0; padding: 10px 20px;">
            ➕ Ajouter une salle
        </button>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Nom de la salle</th>
                    <th>Localisation</th>
                    <th>Seuils (Min)</th>
                    <th>Badge NFC</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="roomsTableBody">
                    <tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--muted);">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Ajout/Modification -->
<div id="roomModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Nouvelle Salle</h3>
            <span class="modal-close" onclick="closeRoomModal()">&times;</span>
        </div>
        <form id="roomForm">
            <input type="hidden" id="roomId">
            <div class="form-group">
                <label for="name">Nom de la salle</label>
                <input type="text" id="name" required placeholder="ex: Salle Égypte antique">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="building">Bâtiment</label>
                    <input type="text" id="building" placeholder="ex: Aile Est">
                </div>
                <div class="form-group">
                    <label for="floor">Étage</label>
                    <input type="text" id="floor" placeholder="ex: 2ème étage">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="orangeThreshold">Seuil Orange (min)</label>
                    <input type="number" id="orangeThreshold" value="120" required>
                </div>
                <div class="form-group">
                    <label for="redThreshold">Seuil Rouge (min)</label>
                    <input type="number" id="redThreshold" value="360" required>
                </div>
            </div>
            <div style="margin-top: 24px; display: flex; gap: 12px;">
                <button type="submit" style="flex: 1;">Enregistrer</button>
                <button type="button" class="secondary" onclick="closeRoomModal()" style="flex: 1;">Annuler</button>
            </div>
        </form>
    </div>
</div>

<script src="app-common.js"></script>
<script>
    requireAuth(["CHEF_DE_POSTE", "DIRECTION"]);
    renderHeader("header", "Administration");

    let rooms = [];

    async function loadRooms() {
        try {
            rooms = await apiFetch("/api/rooms");
            renderTable();
        } catch (e) {
            console.error(e);
        }
    }

    function renderTable() {
        const body = document.getElementById("roomsTableBody");
        if (rooms.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--muted);">Aucune salle configurée.</td></tr>';
            return;
        }

        body.innerHTML = rooms.map(r => `
            <tr>
                <td style="font-weight: 600;">${r.name}</td>
                <td style="font-size: 0.9rem; color: var(--muted);">${[r.building, r.floor].filter(Boolean).join(" / ") || "-"}</td>
                <td style="font-size: 0.85rem;">
                    <span style="color: var(--orange)">${r.orangeThresholdMinutes}m</span> /
                    <span style="color: var(--rouge)">${r.redThresholdMinutes}m</span>
                </td>
                <td>
                    ${r.patchUid ?
                        `<span class="badge VERT" title="${r.patchUid}">✅ Lié</span>` :
                        `<span class="badge ROUGE">❌ Non lié</span>`
                    }
                </td>
                <td>
                    <div style="display: flex; gap: 8px;">
                        <button class="secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="openRoomModal(${r.id})">✏️ Éditer</button>
                        <button class="secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="linkNfc(${r.id}, '${r.name}')">🔗 NFC</button>
                        <button class="danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="deleteRoom(${r.id}, '${r.name}')">🗑️</button>
                    </div>
                </td>
            </tr>
        `).join("");
    }

    function openRoomModal(id = null) {
        const modal = document.getElementById("roomModal");
        const form = document.getElementById("roomForm");
        const title = document.getElementById("modalTitle");

        form.reset();
        if (id) {
            const room = rooms.find(r => r.id === id);
            title.textContent = "Modifier la salle";
            document.getElementById("roomId").value = room.id;
            document.getElementById("name").value = room.name;
            document.getElementById("building").value = room.building || "";
            document.getElementById("floor").value = room.floor || "";
            document.getElementById("orangeThreshold").value = room.orangeThresholdMinutes;
            document.getElementById("redThreshold").value = room.redThresholdMinutes;
        } else {
            title.textContent = "Nouvelle Salle";
            document.getElementById("roomId").value = "";
        }

        modal.style.display = "flex";
    }

    function closeRoomModal() {
        document.getElementById("roomModal").style.display = "none";
    }

    document.getElementById("roomForm").onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("roomId").value;
        const payload = {
            name: document.getElementById("name").value,
            building: document.getElementById("building").value,
            floor: document.getElementById("floor").value,
            orangeThresholdMinutes: parseInt(document.getElementById("orangeThreshold").value),
            redThresholdMinutes: parseInt(document.getElementById("redThreshold").value)
        };

        try {
            if (id) {
                await apiFetch(`/api/rooms/${id}`, { method: "PUT", body: JSON.stringify(payload) });
            } else {
                await apiFetch("/api/rooms", { method: "POST", body: JSON.stringify(payload) });
            }
            closeRoomModal();
            loadRooms();
        } catch (err) {
            alert(err.message);
        }
    };

    async function deleteRoom(id, name) {
        if (!confirm(`Voulez-vous vraiment supprimer la salle "${name}" ?\nLes patches associés seront détachés.`)) return;
        try {
            await apiFetch(`/api/rooms/${id}`, { method: "DELETE" });
            loadRooms();
        } catch (err) {
            alert(err.message);
        }
    }

    async function linkNfc(roomId, roomName) {
        let tagUid = "";
        if (!("NDEFReader" in window)) {
            tagUid = prompt(`Le Web NFC n'est pas supporté.\nSaisissez manuellement l'UID du patch pour "${roomName}" :`);
            if (!tagUid) return;
        } else {
            try {
                alert("Approchez le badge NFC pour l'associer à la salle : " + roomName);
                const ndef = new NDEFReader();
                await ndef.scan();
                const event = await new Promise((resolve, reject) => {
                    ndef.onreading = resolve;
                    ndef.onreadingerror = reject;
                    setTimeout(() => reject(new Error("Timeout : aucun badge détecté")), 10000);
                });
                tagUid = event.serialNumber;
            } catch (e) {
                alert("Erreur NFC : " + e.message);
                return;
            }
        }

        try {
            await apiFetch("/api/patches/enroll", {
                method: "POST",
                body: JSON.stringify({ tagUid, roomId })
            });
            alert("Badge associé avec succès !");
            loadRooms();
        } catch (e) {
            alert("Erreur lors de l'association : " + e.message);
        }
    }

    loadRooms();
</script>
</body>
</html>
