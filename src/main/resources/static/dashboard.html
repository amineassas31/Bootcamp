<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supervision - PC Sécurité</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="header"></header>
<main>
    <div class="card">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin: 0;">État des salles en temps réel</h2>
            <div id="wsStatus" class="badge" style="background: rgba(56, 189, 248, 0.1); color: var(--accent);">Connexion...</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Salle</th>
                    <th>Bâtiment / Étage</th>
                    <th>Dernier contrôle</th>
                    <th>Par</th>
                    <th>Depuis</th>
                    <th>État</th>
                </tr>
                </thead>
                <tbody id="roomsBody">
                    <tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--muted);">Chargement des données...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="app-common.js"></script>
<script>
    const session = requireAuth(["CHEF_DE_POSTE", "DIRECTION"]);
    renderHeader("header", "Supervision");

    let rooms = [];

    function formatElapsed(minutes) {
        if (minutes === null || minutes === undefined) return "Aucun";
        if (minutes < 1) return "À l'instant";
        if (minutes < 60) return minutes + " min";
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return h + "h " + String(m).padStart(2, "0") + "m";
    }

    function levelFor(room) {
        if (room.patchDamaged) return "ROUGE";
        if (room.lastScanAt === null || room.lastScanAt === undefined) return "ROUGE";
        const elapsedMin = Math.floor((Date.now() - new Date(room.lastScanAt).getTime()) / 60000);
        if (elapsedMin < room.orangeThresholdMinutes) return "VERT";
        if (elapsedMin < room.redThresholdMinutes) return "ORANGE";
        return "ROUGE";
    }

    function currentElapsed(room) {
        if (!room.lastScanAt) return null;
        return Math.floor((Date.now() - new Date(room.lastScanAt).getTime()) / 60000);
    }

    function render() {
        const body = document.getElementById("roomsBody");
        if (rooms.length === 0) return;

        const sorted = [...rooms].sort((a, b) => {
            const levelMap = { "ROUGE": 0, "ORANGE": 1, "VERT": 2 };
            const levelA = levelMap[levelFor(a)];
            const levelB = levelMap[levelFor(b)];
            if (levelA !== levelB) return levelA - levelB;
            return (currentElapsed(b) ?? Infinity) - (currentElapsed(a) ?? Infinity);
        });

        body.innerHTML = sorted.map(r => {
            const level = levelFor(r);
            const label = r.patchDamaged ? "⚠️ Patch endommagé" : (r.lastGuardName || "-");
            const elapsed = currentElapsed(r);

            return `
                <tr class="row-${level}">
                    <td style="font-weight: 600;">${r.name}</td>
                    <td>${[r.building, r.floor].filter(Boolean).join(" / ")}</td>
                    <td style="font-size: 0.85rem; color: var(--muted);">${r.lastScanAt ? new Date(r.lastScanAt).toLocaleString("fr-FR", {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'}) : "-"}</td>
                    <td>${label}</td>
                    <td style="font-weight: 500;">${formatElapsed(elapsed)}</td>
                    <td><span class="badge ${level}">${level}</span></td>
                </tr>
            `;
        }).join("");
    }

    async function loadInitial() {
        try {
            rooms = await apiFetch("/api/rooms");
            render();
        } catch (e) {
            console.error(e);
        }
    }

    function connectWs() {
        const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const url = proto + "//" + window.location.host + "/ws/supervision?token=" + encodeURIComponent(session.token);
        const ws = new WebSocket(url);
        const wsStatusEl = document.getElementById("wsStatus");

        ws.onopen = () => {
            wsStatusEl.textContent = "● Temps réel actif";
            wsStatusEl.style.color = "#4ade80";
        };
        ws.onmessage = (evt) => {
            rooms = JSON.parse(evt.data);
            render();
        };
        ws.onclose = () => {
            wsStatusEl.textContent = "○ Déconnecté";
            wsStatusEl.style.color = "var(--rouge)";
            setTimeout(connectWs, 3000);
        };
        ws.onerror = () => ws.close();
    }

    loadInitial();
    connectWs();
    setInterval(render, 10000); // Rafraîchissement du temps toutes les 10s
</script>
</body>
</html>
