<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan de ronde - Rondes NFC</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="header"></header>
<main>
    <div class="card" style="text-align: center; padding: 40px 24px;">
        <div style="font-size: 3rem; margin-bottom: 20px;">🛡️</div>
        <h2 style="margin-top: 0;">Contrôle de passage</h2>
        <p class="pill" style="margin-bottom: 32px;">Approchez votre téléphone du patch NFC de la salle pour valider votre passage.</p>

        <button id="activateBtn" class="big-btn" style="max-width: 300px; margin: 0 auto;">
            Activer le lecteur NFC
        </button>

        <div id="status" class="status-line" style="max-width: 400px; margin: 20px auto 0;"></div>
        <div id="queueInfo" class="badge" style="margin-top: 20px; background: rgba(245, 158, 11, 0.1); color: var(--orange); border: 1px solid rgba(245, 158, 11, 0.2); display: none;"></div>
    </div>

    <div class="card" id="fallbackCard" style="display:none; border-style: dashed; background: rgba(30, 41, 59, 0.5);">
        <h3 style="color: var(--muted); font-size: 1rem;">Mode de secours</h3>
        <p class="pill" style="margin-bottom: 16px;">Web NFC indisponible ou désactivé. Saisie manuelle pour démonstration.</p>
        <div style="display: flex; gap: 10px;">
            <input id="manualUid" placeholder="ID du patch (ex: 04:A2:B3...)" style="flex: 1;">
            <button onclick="handleTagRead(document.getElementById('manualUid').value.trim())" style="white-space: nowrap;">Valider</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 1rem;">Derniers badges</h3>
        <div id="historyList"></div>
    </div>
</main>
<script src="app-common.js"></script>
<script>
    requireAuth(["GARDIEN", "CHEF_DE_POSTE", "DIRECTION"]);
    renderHeader("header", "Scan de ronde");

    const statusEl = document.getElementById("status");
    const queueInfoEl = document.getElementById("queueInfo");
    const historyListEl = document.getElementById("historyList");
    const QUEUE_KEY = "rondes_offline_queue";
    const HISTORY_KEY = "rondes_scan_history";
    const HISTORY_MAX = 20;

    function readQueue() {
        try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch (e) { return []; }
    }
    function writeQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
    function refreshQueueInfo() {
        const q = readQueue();
        if (q.length > 0) {
            queueInfoEl.textContent = "⏳ " + q.length + " scan(s) en attente de synchronisation";
            queueInfoEl.style.display = "inline-flex";
        } else {
            queueInfoEl.style.display = "none";
        }
    }
    refreshQueueInfo();

    // Historique local des derniers badges (tous statuts), distinct de la file d'attente
    // qui ne garde que ce qui reste a renvoyer. Permet au gardien de voir son activite
    // recente meme sans reseau.
    function readHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { return []; }
    }
    function writeHistory(items) { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); }

    function addHistoryEntry(entry) {
        const items = readHistory();
        items.unshift(entry);
        writeHistory(items.slice(0, HISTORY_MAX));
        renderHistory();
    }

    function updateHistoryEntry(id, patch) {
        const items = readHistory();
        const idx = items.findIndex((item) => item.id === id);
        if (idx === -1) return;
        items[idx] = Object.assign(items[idx], patch);
        writeHistory(items);
        renderHistory();
    }

    function renderHistory() {
        const items = readHistory();
        if (items.length === 0) {
            historyListEl.innerHTML = '<p class="pill">Aucun badge pour le moment.</p>';
            return;
        }
        historyListEl.innerHTML = items.map((item) => {
            const time = new Date(item.scannedAt).toLocaleString("fr-FR");
            const cls = item.status === "synced" ? "VERT" : item.status === "error" ? "ROUGE" : "ORANGE";
            const label = item.status === "synced" ? (item.roomName || "Synchronisé")
                : item.status === "error" ? (item.detail || "Refusé")
                : "En attente de synchronisation";
            return `<div class="row-${cls}" style="padding: 10px 14px; margin-bottom: 8px; border-radius: 8px; background: rgba(255,255,255,0.03);">
                <div style="display:flex; justify-content: space-between; align-items: center; gap: 10px;">
                    <span style="font-family: monospace;">${item.tagUid}</span>
                    <span class="badge ${cls}">${label}</span>
                </div>
                <div class="pill" style="margin-top:4px;">${time}</div>
            </div>`;
        }).join("");
    }
    renderHistory();

    function newId() {
        return Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    }

    async function sendScan(tagUid, scannedAt) {
        return apiFetch("/api/scan", {
            method: "POST",
            body: JSON.stringify({ tagUid, scannedAt }),
        });
    }

    async function handleTagRead(tagUid) {
        if (!tagUid) return;
        const scannedAt = new Date().toISOString();
        const id = newId();
        addHistoryEntry({ id, tagUid, scannedAt, status: "pending" });

        statusEl.className = "status-line";
        statusEl.textContent = "Envoi en cours...";
        try {
            const result = await sendScan(tagUid, scannedAt);
            statusEl.className = "status-line ok";
            statusEl.innerHTML = `<strong>Succès !</strong><br>${result.roomName} contrôlée par ${result.guardName}` +
                (result.offlineSync ? "<br><small>Synchronisé depuis le mode hors-ligne</small>" : "");
            updateHistoryEntry(id, { status: "synced", roomName: result.roomName });

            // Petit feedback visuel
            document.body.style.backgroundColor = "#064e3b";
            setTimeout(() => document.body.style.backgroundColor = "var(--bg)", 500);

        } catch (e) {
            if (e instanceof TypeError || e.message.includes("Failed to fetch")) {
                const q = readQueue();
                q.push({ id, tagUid, scannedAt });
                writeQueue(q);
                refreshQueueInfo();
                statusEl.className = "status-line err";
                statusEl.textContent = "Hors ligne : Scan enregistré localement. Il sera envoyé dès le retour du réseau.";
                updateHistoryEntry(id, { status: "pending", detail: "Hors ligne, en attente de synchronisation" });
            } else {
                statusEl.className = "status-line err";
                statusEl.textContent = "Erreur : " + e.message;
                updateHistoryEntry(id, { status: "error", detail: e.message });
            }
        }
    }

    async function flushQueue() {
        const q = readQueue();
        if (q.length === 0) return;
        const remaining = [];
        for (const item of q) {
            try {
                const result = await sendScan(item.tagUid, item.scannedAt);
                if (item.id) updateHistoryEntry(item.id, { status: "synced", roomName: result.roomName });
            } catch (e) {
                remaining.push(item);
            }
        }
        writeQueue(remaining);
        refreshQueueInfo();
    }
    window.addEventListener("online", flushQueue);
    setInterval(flushQueue, 30000);
    flushQueue();

    document.getElementById("activateBtn").addEventListener("click", async () => {
        if (!("NDEFReader" in window)) {
            statusEl.className = "status-line err";
            statusEl.textContent = "Web NFC non supporté sur ce navigateur.";
            document.getElementById("fallbackCard").style.display = "block";
            return;
        }
        try {
            const ndef = new NDEFReader();
            await ndef.scan();
            statusEl.className = "status-line ok";
            statusEl.textContent = "Lecteur actif. Approchez un patch NFC...";

            document.getElementById("activateBtn").textContent = "Lecteur en écoute...";
            document.getElementById("activateBtn").disabled = true;
            document.getElementById("activateBtn").style.opacity = "0.7";

            ndef.onreading = (event) => {
                handleTagRead(event.serialNumber);
            };
            ndef.onreadingerror = () => {
                statusEl.className = "status-line err";
                statusEl.textContent = "Lecture échouée. Veuillez réessayer.";
            };
        } catch (e) {
            statusEl.className = "status-line err";
            statusEl.textContent = "Erreur d'activation : " + e.message;
            document.getElementById("fallbackCard").style.display = "block";
        }
    });
</script>
</body>
</html>
