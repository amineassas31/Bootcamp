<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supervision des rondes NFC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header"></header>
<main>
    <div class="card">
        <h2>Accueil</h2>
        <p class="pill">Selectionnez votre poste de travail.</p>
        <p><a href="scan.html">Scanner une salle (gardien)</a></p>
        <p><a href="dashboard.html">Ecran de supervision (PC securite)</a></p>
        <p><a href="history.html">Historique des passages</a></p>
        <p><a href="enroll.html">Associer un patch a une salle (admin)</a></p>
    </div>
</main>
<script src="app-common.js"></script>
<script>
    // Sur l'index, on n'oblige pas la connexion (requireAuth),
    // mais on affiche l'entête si l'utilisateur est déjà là.
    const session = getSession();
    if (session.token) {
        renderHeader("header", "Supervision des rondes NFC");
    } else {
        document.getElementById("header").innerHTML = "<h1>Supervision des rondes NFC</h1><div><a href='login.html' class='badge VERT'>Connexion</a></div>";
    }
</script>
</body>
</html>
