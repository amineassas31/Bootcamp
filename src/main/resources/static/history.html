<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historique des passages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header"></header>
<main>
    <div class="card">
        <h2>Historique</h2>
        <p class="pill" id="scopeInfo"></p>
        <label for="roomFilter">Salle (optionnel)</label>
        <select id="roomFilter"><option value="">Toutes</option></select>
        <button onclick="load()">Filtrer</button>
        <table>
            <thead><tr><th>Date</th><th>Salle</th><th>Gardien</th><th>Origine</th></tr></thead>
            <tbody id="body"></tbody>
        </table>
    </div>
</main>
<script src="app-common.js"></script>
<script>
    const session = requireAuth(["GARDIEN", "CHEF_DE_POSTE", "DIRECTION"]);
    renderHeader("header", "Historique des passages");
    document.getElementById("scopeInfo").textContent = session.role === "GARDIEN"
        ? "Vous consultez uniquement vos propres passages."
        : "Vue complete (chef de poste / direction).";

    async function loadRoomsFilter() {
        if (session.role === "GARDIEN") {
            document.getElementById("roomFilter").style.display = "none";
            return;
        }
        const rooms = await apiFetch("/api/rooms");
        const select = document.getElementById("roomFilter");
        select.innerHTML += rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
    }

    async function load() {
        const roomId = document.getElementById("roomFilter").value;
        const query = roomId ? ("?roomId=" + roomId) : "";
        const entries = await apiFetch("/api/history" + query);
        document.getElementById("body").innerHTML = entries.map(e => `
            <tr>
                <td>${new Date(e.scannedAt).toLocaleString("fr-FR")}</td>
                <td>${e.roomName}</td>
                <td>${e.guardName}</td>
                <td>${e.offlineSync ? "Synchro hors-ligne" : "Direct"}</td>
            </tr>
        `).join("");
    }

    loadRoomsFilter().then(load);
</script>
</body>
</html>
